<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="asp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="asp-anoxic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A47A"/>
      <stop offset="100%" stop-color="#8D6E4F"/>
    </linearGradient>
    <linearGradient id="asp-aerated" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="asp-clear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
  </defs>

  <!-- Rounded background panel -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#asp-bg)"/>

  <!-- Influent arrow in -->
  <g stroke="#37474F" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="11" y1="56" x2="24" y2="56"/>
  </g>
  <polygon points="22,49 32,56 22,63" fill="#37474F"/>

  <!-- Anoxic tanks (brown, 2) -->
  <g stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round">
    <rect x="30" y="40" width="16" height="44" rx="2" fill="url(#asp-anoxic)"/>
    <rect x="48" y="40" width="16" height="44" rx="2" fill="url(#asp-anoxic)"/>
  </g>

  <!-- Aerated tank (blue) with bold bubbles -->
  <rect x="66" y="40" width="18" height="44" rx="2" fill="url(#asp-aerated)" stroke="#01579B" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#E1F5FE">
    <circle cx="72" cy="72" r="3"/>
    <circle cx="79" cy="65" r="3"/>
    <circle cx="73" cy="57" r="3"/>
    <circle cx="80" cy="50" r="3"/>
  </g>

  <!-- Secondary clarifier (settling funnel) -->
  <polygon points="90,40 114,40 104,72 100,72" fill="url(#asp-clear)" stroke="#01579B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Settled sludge tip -->
  <polygon points="100,64 104,64 104,72 100,72" fill="#8D6E4F"/>

  <!-- Clean effluent arrow out (top right) -->
  <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="114" y1="48" x2="119" y2="48"/>
  </g>

  <!-- Return sludge recycle loop (brown) -->
  <polyline points="102,72 102,102 38,102 38,74" fill="none" stroke="#8D6E4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="33,78 38,69 43,78" fill="#8D6E4F"/>
</svg>
