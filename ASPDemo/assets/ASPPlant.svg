<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="-100.0 -100.0 200.0 200.0">
<g transform="scale(1,-1) translate(0,-0.0)">

  <!-- ===== Anoxic tanks (2) — brown fill ===== -->
  <!-- Tank 1 -->
  <rect x="-78" y="-10" width="28" height="50" fill="rgb(223,191,159)" stroke="rgb(0,0,0)" stroke-width="0.75"/>
  <!-- Tank 2 -->
  <rect x="-48" y="-10" width="28" height="50" fill="rgb(223,191,159)" stroke="rgb(0,0,0)" stroke-width="0.75"/>

  <!-- Mixer paddles in anoxic tanks -->
  <!-- Tank 1 paddle -->
  <line x1="-64" y1="15" x2="-64" y2="30" stroke="rgb(0,0,0)" stroke-width="1.0"/>
  <line x1="-69" y1="15" x2="-59" y2="15" stroke="rgb(0,0,0)" stroke-width="1.0"/>
  <!-- Tank 2 paddle -->
  <line x1="-34" y1="15" x2="-34" y2="30" stroke="rgb(0,0,0)" stroke-width="1.0"/>
  <line x1="-39" y1="15" x2="-29" y2="15" stroke="rgb(0,0,0)" stroke-width="1.0"/>

  <!-- Suspended particles in anoxic tanks -->
  <circle cx="-71" cy="5" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-60" cy="22" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-67" cy="34" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-55" cy="10" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-41" cy="5" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-30" cy="22" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-37" cy="34" r="1" fill="rgb(191,95,0)" stroke="none"/>
  <circle cx="-25" cy="10" r="1" fill="rgb(191,95,0)" stroke="none"/>

  <!-- ===== Aerated tanks (3) — blue fill ===== -->
  <!-- Tank 3 -->
  <rect x="-18" y="-10" width="28" height="50" fill="rgb(159,191,223)" stroke="rgb(0,0,0)" stroke-width="0.75"/>
  <!-- Tank 4 -->
  <rect x="12" y="-10" width="28" height="50" fill="rgb(159,191,223)" stroke="rgb(0,0,0)" stroke-width="0.75"/>
  <!-- Tank 5 -->
  <rect x="42" y="-10" width="28" height="50" fill="rgb(159,191,223)" stroke="rgb(0,0,0)" stroke-width="0.75"/>

  <!-- Aeration bubbles in tank 3 -->
  <circle cx="-10" cy="-2" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="-4" cy="5" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="-8" cy="14" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="-2" cy="22" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="-7" cy="30" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="2" cy="34" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>

  <!-- Aeration bubbles in tank 4 -->
  <circle cx="20" cy="-2" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="26" cy="5" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="22" cy="14" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="28" cy="22" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="23" cy="30" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="32" cy="34" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>

  <!-- Aeration bubbles in tank 5 -->
  <circle cx="50" cy="-2" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="56" cy="5" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="52" cy="14" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="58" cy="22" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="53" cy="30" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>
  <circle cx="62" cy="34" r="1.5" fill="none" stroke="rgb(0,127,255)" stroke-width="0.5"/>

  <!-- ===== Secondary clarifier (trapezoid) ===== -->
  <!-- Clarifier body — sludge layer at bottom, clear water on top -->
  <polygon points="42,-60 78,-60 72,-40 48,-40" fill="rgb(0,127,255)" stroke="rgb(0,0,0)" stroke-width="0.75"/>
  <polygon points="48,-40 72,-40 68,-30 52,-30" fill="rgb(159,191,223)" stroke="none"/>
  <polygon points="52,-30 68,-30 66,-24 54,-24" fill="rgb(223,191,159)" stroke="none"/>
  <!-- Clarifier outline -->
  <polyline points="42,-60 48,-40 52,-30 54,-24" stroke="rgb(0,0,0)" stroke-width="0.75" fill="none"/>
  <polyline points="78,-60 72,-40 68,-30 66,-24" stroke="rgb(0,0,0)" stroke-width="0.75" fill="none"/>
  <line x1="42" y1="-60" x2="78" y2="-60" stroke="rgb(0,0,0)" stroke-width="0.75"/>
  <line x1="54" y1="-24" x2="66" y2="-24" stroke="rgb(0,0,0)" stroke-width="0.75"/>

  <!-- ===== Flow arrows ===== -->
  <!-- Influent arrow into tank 1 -->
  <line x1="-95" y1="15" x2="-78" y2="15" stroke="rgb(0,0,0)" stroke-width="1.0"/>
  <polygon points="-82,18 -78,15 -82,12" fill="rgb(0,0,0)" stroke="none"/>

  <!-- Flow from tank 5 to clarifier -->
  <polyline points="70,-10 70,-28 78,-28" stroke="rgb(0,0,0)" stroke-width="0.75" fill="none"/>
  <line x1="70" y1="-10" x2="70" y2="-15" stroke="rgb(0,0,0)" stroke-width="0.75"/>

  <!-- Feed pipe into clarifier top -->
  <line x1="60" y1="-10" x2="60" y2="-60" stroke="rgb(0,0,0)" stroke-width="0.75"/>
  <polygon points="57,-56 60,-60 63,-56" fill="rgb(0,0,0)" stroke="none"/>

  <!-- Effluent arrow from clarifier (top right) -->
  <line x1="78" y1="-50" x2="95" y2="-50" stroke="rgb(0,127,255)" stroke-width="1.5"/>
  <polygon points="91,-47 95,-50 91,-53" fill="rgb(0,127,255)" stroke="none"/>

  <!-- ===== Return sludge recycle line ===== -->
  <!-- From clarifier bottom down and back to mixer/tank 1 -->
  <polyline points="60,-24 60,-70 -85,-70 -85,15 -78,15" stroke="rgb(191,95,0)" stroke-width="1.0" fill="none"/>
  <polygon points="-82,18 -78,15 -82,12" fill="rgb(191,95,0)" stroke="none"/>

  <!-- Internal recycle arrow from tank 5 area back to tank 1 -->
  <polyline points="56,42 56,52 -64,52 -64,40" stroke="rgb(128,128,128)" stroke-width="0.75" fill="none" stroke-dasharray="3,2"/>
  <polygon points="-67,44 -64,40 -61,44" fill="rgb(128,128,128)" stroke="none"/>

  <!-- ===== Waste sludge arrow from clarifier bottom ===== -->
  <line x1="60" y1="-24" x2="60" y2="-24" stroke="rgb(191,95,0)" stroke-width="1.0"/>
  <line x1="66" y1="-24" x2="80" y2="-24" stroke="rgb(191,95,0)" stroke-width="1.0"/>

  <!-- ===== Labels ===== -->
  <!-- Note: text is unflipped since we have scale(1,-1) -->
  <g transform="scale(1,-1)">
    <text x="-64" y="80" text-anchor="middle" font-size="8" font-family="sans-serif" fill="rgb(0,0,0)">Anoxic</text>
    <text x="12" y="80" text-anchor="middle" font-size="8" font-family="sans-serif" fill="rgb(0,0,0)">Aerated</text>
    <text x="60" y="80" text-anchor="middle" font-size="8" font-family="sans-serif" fill="rgb(0,0,0)">Clarifier</text>
  </g>

</g>
</svg>
