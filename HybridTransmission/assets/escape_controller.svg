<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ecuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#117a65;stop-opacity:1" />
    </linearGradient>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- ECU housing -->
  <rect x="18" y="22" width="64" height="56" fill="url(#ecuGrad)" stroke="#0d1821" stroke-width="2" rx="4"/>
  
  <!-- Circuit board -->
  <rect x="23" y="27" width="54" height="46" fill="url(#pcbGrad)" stroke="#0e6655" stroke-width="1.5" rx="2"/>
  
  <!-- Microprocessor chip -->
  <rect x="38" y="40" width="24" height="20" fill="#34495e" stroke="#1a252f" stroke-width="1.5" rx="1.5"/>
  <rect x="40" y="42" width="20" height="16" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="1"/>
  
  <!-- Processor core (animated) -->
  <rect x="44" y="46" width="12" height="8" fill="#3498db" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- IC pins -->
  <g opacity="0.7">
    <line x1="33" y1="43" x2="38" y2="43" stroke="#95a5a6" stroke-width="1"/>
    <line x1="33" y1="47" x2="38" y2="47" stroke="#95a5a6" stroke-width="1"/>
    <line x1="33" y1="51" x2="38" y2="51" stroke="#95a5a6" stroke-width="1"/>
    <line x1="33" y1="55" x2="38" y2="55" stroke="#95a5a6" stroke-width="1"/>
    <line x1="62" y1="43" x2="67" y2="43" stroke="#95a5a6" stroke-width="1"/>
    <line x1="62" y1="47" x2="67" y2="47" stroke="#95a5a6" stroke-width="1"/>
    <line x1="62" y1="51" x2="67" y2="51" stroke="#95a5a6" stroke-width="1"/>
    <line x1="62" y1="55" x2="67" y2="55" stroke="#95a5a6" stroke-width="1"/>
  </g>
  
  <!-- Capacitors -->
  <g id="capacitors">
    <rect x="26" y="32" width="3" height="8" fill="#f39c12" stroke="#d68910" stroke-width="0.8" rx="0.5"/>
    <rect x="30" y="32" width="3" height="8" fill="#f39c12" stroke="#d68910" stroke-width="0.8" rx="0.5"/>
    <rect x="67" y="32" width="3" height="8" fill="#f39c12" stroke="#d68910" stroke-width="0.8" rx="0.5"/>
    <rect x="71" y="32" width="3" height="8" fill="#f39c12" stroke="#d68910" stroke-width="0.8" rx="0.5"/>
  </g>
  
  <!-- Resistors -->
  <rect x="26" y="64" width="12" height="3" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="0.8"/>
  <rect x="62" y="64" width="12" height="3" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="0.8"/>
  
  <!-- Circuit traces (animated data flow) -->
  <g opacity="0.5">
    <path d="M 26 50 Q 30 50, 38 50" fill="none" stroke="#48c9b0" stroke-width="1.5">
      <animate attributeName="stroke" values="#48c9b0;#1abc9c;#48c9b0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 62 50 Q 67 50, 74 50" fill="none" stroke="#48c9b0" stroke-width="1.5">
      <animate attributeName="stroke" values="#48c9b0;#1abc9c;#48c9b0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Data processing indicator -->
  <circle cx="50" cy="35" r="2" fill="#3498db" filter="url(#screenGlow)">
    <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- LED indicators (status lights) -->
  <g id="leds">
    <circle cx="28" cy="30" r="1.5" fill="#27ae60">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="33" cy="30" r="1.5" fill="#27ae60">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="30" r="1.5" fill="#f39c12">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ECMS label -->
  <text x="50" y="69" font-size="8" fill="#ecf0f1" font-weight="bold" text-anchor="middle" opacity="0.9">ECMS</text>
</svg>
