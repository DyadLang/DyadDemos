<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48c9b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="rotorGrad">
      <stop offset="0%" style="stop-color:#7f8c8d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </radialGradient>
    <filter id="motorGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Motor housing -->
  <circle cx="50" cy="50" r="32" fill="url(#motorGrad)" stroke="#1e8449" stroke-width="2"/>
  
  <!-- Stator coils (3-phase) with glow -->
  <circle cx="50" cy="28" r="6" fill="url(#coilGrad)" stroke="#0e6655" stroke-width="1.5" filter="url(#motorGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="42" r="6" fill="url(#coilGrad)" stroke="#0e6655" stroke-width="1.5" filter="url(#motorGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="58" r="6" fill="url(#coilGrad)" stroke="#0e6655" stroke-width="1.5" filter="url(#motorGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="72" r="6" fill="url(#coilGrad)" stroke="#0e6655" stroke-width="1.5" filter="url(#motorGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="58" r="6" fill="url(#coilGrad)" stroke="#0e6655" stroke-width="1.5" filter="url(#motorGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="42" r="6" fill="url(#coilGrad)" stroke="#0e6655" stroke-width="1.5" filter="url(#motorGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Rotor (animated rotation) -->
  <g id="rotor">
    <circle cx="50" cy="50" r="14" fill="url(#rotorGrad)" stroke="#2c3e50" stroke-width="2"/>
    <!-- Rotor poles -->
    <rect x="48" y="38" width="4" height="10" fill="#e74c3c" rx="1"/>
    <rect x="48" y="52" width="4" height="10" fill="#3498db" rx="1"/>
    <rect x="38" y="48" width="10" height="4" fill="#e74c3c" rx="1"/>
    <rect x="52" y="48" width="10" height="4" fill="#3498db" rx="1"/>
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.5s" repeatCount="indefinite"/>
  </g>
  
  <!-- Center shaft -->
  <circle cx="50" cy="50" r="4" fill="#34495e" stroke="#1a252f" stroke-width="1"/>
  
  <!-- Mounting points -->
  <circle cx="20" cy="50" r="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  <circle cx="80" cy="50" r="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  
  <!-- Field lines (electromagnetic effect) -->
  <g opacity="0.3">
    <ellipse cx="50" cy="50" rx="38" ry="38" fill="none" stroke="#48c9b0" stroke-width="0.5" stroke-dasharray="2,2">
      <animate attributeName="rx" values="38;42;38" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="38;42;38" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
