<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="graphGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d5dbdb;stop-opacity:1" />
    </linearGradient>
    <filter id="traceGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="10" y="15" width="80" height="60" fill="url(#bgGrad)" stroke="#95a5a6" stroke-width="1.5" rx="3"/>
  
  <!-- Grid lines -->
  <line x1="10" y1="28" x2="90" y2="28" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="41" x2="90" y2="41" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="54" x2="90" y2="54" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="67" x2="90" y2="67" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="23" y1="15" x2="23" y2="75" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="36" y1="15" x2="36" y2="75" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="50" y1="15" x2="50" y2="75" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="63" y1="15" x2="63" y2="75" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  <line x1="77" y1="15" x2="77" y2="75" stroke="#bdc3c7" stroke-width="0.5" opacity="0.6"/>
  
  <!-- EPA HWFET speed profile (simplified) -->
  <path d="M 10 75 L 14 72 L 18 66 L 23 56 L 28 42 L 33 32 L 40 28 L 60 28 L 65 30 L 72 34 L 78 38 L 85 41 L 90 43" 
        fill="url(#graphGrad)" stroke="none"/>
  
  <!-- Speed trace line -->
  <path d="M 10 75 L 14 72 L 18 66 L 23 56 L 28 42 L 33 32 L 40 28 L 60 28 L 65 30 L 72 34 L 78 38 L 85 41 L 90 43" 
        fill="none" stroke="#2874a6" stroke-width="2.5" stroke-linecap="round" filter="url(#traceGlow)"/>
  
  <!-- Animated trace point -->
  <circle r="3" fill="#e74c3c" filter="url(#traceGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" 
                   path="M 10 75 L 14 72 L 18 66 L 23 56 L 28 42 L 33 32 L 40 28 L 60 28 L 65 30 L 72 34 L 78 38 L 85 41 L 90 43"/>
  </circle>
  
  <!-- Data markers -->
  <circle cx="23" cy="56" r="2" fill="#2874a6"/>
  <circle cx="40" cy="28" r="2" fill="#2874a6"/>
  <circle cx="65" cy="30" r="2" fill="#2874a6"/>
  <circle cx="85" cy="41" r="2" fill="#2874a6"/>
  
  <!-- Axes -->
  <line x1="10" y1="75" x2="90" y2="75" stroke="#2c3e50" stroke-width="2"/>
  <line x1="10" y1="15" x2="10" y2="75" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Axis arrows -->
  <polygon points="90,75 87,73 87,77" fill="#2c3e50"/>
  <polygon points="10,15 8,18 12,18" fill="#2c3e50"/>
  
  <!-- Labels -->
  <text x="50" y="87" font-size="7" fill="#34495e" text-anchor="middle" font-weight="bold">Time (s)</text>
  <text x="5" y="45" font-size="7" fill="#34495e" text-anchor="middle" transform="rotate(-90 5 45)" font-weight="bold">Speed</text>
  
  <!-- EPA HWFET badge -->
  <rect x="14" y="18" width="32" height="9" fill="#e74c3c" rx="2" opacity="0.9"/>
  <text x="30" y="24" font-size="6" fill="white" font-weight="bold" text-anchor="middle">EPA HWFET</text>
  
  <!-- Time indicator -->
  <g opacity="0.8">
    <circle cx="85" cy="20" r="6" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <line x1="85" y1="20" x2="85" y2="17" stroke="#7f8c8d" stroke-width="1.2"/>
    <line x1="85" y1="20" x2="87" y2="20" stroke="#7f8c8d" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="0 85 20" to="360 85 20" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
