<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ring gear (outer) -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#333" stroke-width="8"/>
  
  <!-- Ring gear teeth -->
  <circle cx="50" cy="15" r="2" fill="#333"/>
  <circle cx="65" cy="20" r="2" fill="#333"/>
  <circle cx="77" cy="30" r="2" fill="#333"/>
  <circle cx="85" cy="50" r="2" fill="#333"/>
  <circle cx="77" cy="70" r="2" fill="#333"/>
  <circle cx="65" cy="80" r="2" fill="#333"/>
  <circle cx="50" cy="85" r="2" fill="#333"/>
  <circle cx="35" cy="80" r="2" fill="#333"/>
  <circle cx="23" cy="70" r="2" fill="#333"/>
  <circle cx="15" cy="50" r="2" fill="#333"/>
  <circle cx="23" cy="30" r="2" fill="#333"/>
  <circle cx="35" cy="20" r="2" fill="#333"/>
  
  <!-- Planet carrier (middle) -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="3,2"/>
  
  <!-- Planet gears (3 planets at 120° intervals) -->
  <circle cx="50" cy="28" r="8" fill="#95A5A6" stroke="#000" stroke-width="1.5"/>
  <circle cx="69" cy="60" r="8" fill="#95A5A6" stroke="#000" stroke-width="1.5"/>
  <circle cx="31" cy="60" r="8" fill="#95A5A6" stroke="#000" stroke-width="1.5"/>
  
  <!-- Planet gear teeth indicators -->
  <circle cx="50" cy="22" r="1.5" fill="#666"/>
  <circle cx="69" cy="54" r="1.5" fill="#666"/>
  <circle cx="31" cy="54" r="1.5" fill="#666"/>
  
  <!-- Sun gear (center) -->
  <circle cx="50" cy="50" r="12" fill="#E67E22" stroke="#000" stroke-width="2"/>
  <rect x="47" y="40" width="6" height="20" fill="#D35400" stroke="#000" stroke-width="1"/>
  <rect x="40" y="47" width="20" height="6" fill="#D35400" stroke="#000" stroke-width="1"/>
  
  <!-- Sun gear teeth -->
  <circle cx="50" cy="38" r="1.5" fill="#C0392B"/>
  <circle cx="58" cy="42" r="1.5" fill="#C0392B"/>
  <circle cx="58" cy="58" r="1.5" fill="#C0392B"/>
  <circle cx="50" cy="62" r="1.5" fill="#C0392B"/>
  <circle cx="42" cy="58" r="1.5" fill="#C0392B"/>
  <circle cx="42" cy="42" r="1.5" fill="#C0392B"/>
  
  <!-- Carrier input port (top boundary) -->
  <circle cx="50" cy="5" r="5" fill="#4A90E2" stroke="#000" stroke-width="1.5"/>
  <line x1="50" y1="0" x2="50" y2="10" stroke="#000" stroke-width="1.5"/>
  <text x="46" y="18" font-size="7" fill="#333" font-weight="bold">C</text>
  
  <!-- Sun input port (left boundary) -->
  <circle cx="5" cy="50" r="5" fill="#4A90E2" stroke="#000" stroke-width="1.5"/>
  <line x1="0" y1="50" x2="10" y2="50" stroke="#000" stroke-width="1.5"/>
  <text x="12" y="53" font-size="7" fill="#333" font-weight="bold">S</text>
  
  <!-- Ring output port (right boundary) -->
  <circle cx="95" cy="50" r="6" fill="#E74C3C" stroke="#000" stroke-width="2"/>
  <line x1="90" y1="50" x2="100" y2="50" stroke="#000" stroke-width="1.5"/>
  <line x1="95" y1="45" x2="95" y2="55" stroke="#000" stroke-width="1.5"/>
  <text x="82" y="53" font-size="7" fill="#333" font-weight="bold">R</text>
</svg>
