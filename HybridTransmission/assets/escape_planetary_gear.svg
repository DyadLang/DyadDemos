<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </radialGradient>
    <filter id="gearGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Ring gear (outer) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Ring gear teeth (inner) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#5d6d7e" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Planet carrier arms (rotating) -->
  <g id="carrier">
    <line x1="50" y1="50" x2="50" y2="28" stroke="#7f8c8d" stroke-width="2.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="66" y2="59" stroke="#7f8c8d" stroke-width="2.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="34" y2="59" stroke="#7f8c8d" stroke-width="2.5" opacity="0.6"/>
    <circle cx="50" cy="50" r="4" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="6s" repeatCount="indefinite"/>
  </g>
  
  <!-- Planet gears (counter-rotating) -->
  <g id="planets">
    <g id="planet1">
      <circle cx="50" cy="28" r="9" fill="url(#planetGrad)" stroke="#0e6655" stroke-width="2" filter="url(#gearGlow)"/>
      <circle cx="50" cy="28" r="7" fill="none" stroke="#0a4d40" stroke-width="1" stroke-dasharray="2,2"/>
      <g>
        <line x1="50" y1="23" x2="50" y2="33" stroke="#0a4d40" stroke-width="1"/>
        <line x1="45" y1="28" x2="55" y2="28" stroke="#0a4d40" stroke-width="1"/>
        <animateTransform attributeName="transform" type="rotate" from="0 50 28" to="-360 50 28" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>
    
    <g id="planet2">
      <circle cx="66" cy="59" r="9" fill="url(#planetGrad)" stroke="#0e6655" stroke-width="2" filter="url(#gearGlow)"/>
      <circle cx="66" cy="59" r="7" fill="none" stroke="#0a4d40" stroke-width="1" stroke-dasharray="2,2"/>
      <g>
        <line x1="66" y1="54" x2="66" y2="64" stroke="#0a4d40" stroke-width="1"/>
        <line x1="61" y1="59" x2="71" y2="59" stroke="#0a4d40" stroke-width="1"/>
        <animateTransform attributeName="transform" type="rotate" from="0 66 59" to="-360 66 59" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>
    
    <g id="planet3">
      <circle cx="34" cy="59" r="9" fill="url(#planetGrad)" stroke="#0e6655" stroke-width="2" filter="url(#gearGlow)"/>
      <circle cx="34" cy="59" r="7" fill="none" stroke="#0a4d40" stroke-width="1" stroke-dasharray="2,2"/>
      <g>
        <line x1="34" y1="54" x2="34" y2="64" stroke="#0a4d40" stroke-width="1"/>
        <line x1="29" y1="59" x2="39" y2="59" stroke="#0a4d40" stroke-width="1"/>
        <animateTransform attributeName="transform" type="rotate" from="0 34 59" to="-360 34 59" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>
    
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="6s" repeatCount="indefinite"/>
  </g>
  
  <!-- Sun gear (center, rotating) -->
  <g id="sun">
    <circle cx="50" cy="50" r="11" fill="url(#sunGrad)" stroke="#d68910" stroke-width="2" filter="url(#gearGlow)"/>
    <circle cx="50" cy="50" r="9" fill="none" stroke="#ca6f1e" stroke-width="1" stroke-dasharray="2,2"/>
    <g>
      <line x1="50" y1="43" x2="50" y2="57" stroke="#ca6f1e" stroke-width="1.5"/>
      <line x1="43" y1="50" x2="57" y2="50" stroke="#ca6f1e" stroke-width="1.5"/>
      <line x1="45" y1="45" x2="55" y2="55" stroke="#ca6f1e" stroke-width="1"/>
      <line x1="55" y1="45" x2="45" y2="55" stroke="#ca6f1e" stroke-width="1"/>
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Gear ratio label -->
  <text x="85" y="88" font-size="10" fill="#2c3e50" font-weight="bold" opacity="0.7">2.6</text>
</svg>
