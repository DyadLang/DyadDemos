<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Motor housing -->
  <circle cx="50" cy="50" r="30" fill="#2E86AB" stroke="#000" stroke-width="2"/>
  
  <!-- Motor coils (multiple windings) -->
  <circle cx="50" cy="50" r="23" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  
  <!-- Stator poles -->
  <circle cx="50" cy="27" r="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
  <circle cx="65" cy="35" r="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
  <circle cx="65" cy="65" r="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
  <circle cx="50" cy="73" r="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
  <circle cx="35" cy="65" r="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
  <circle cx="35" cy="35" r="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
  
  <!-- Rotor (static position) -->
  <circle cx="50" cy="50" r="12" fill="#E74C3C" stroke="#000" stroke-width="2"/>
  <rect x="47" y="38" width="6" height="24" fill="#C0392B" stroke="#000" stroke-width="1" rx="1"/>
  <rect x="38" y="47" width="24" height="6" fill="#C0392B" stroke="#000" stroke-width="1" rx="1"/>
  
  <!-- Shaft -->
  <circle cx="50" cy="50" r="4" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Torque command input port (left boundary) -->
  <circle cx="5" cy="50" r="5" fill="#4A90E2" stroke="#000" stroke-width="1.5"/>
  <text x="2" y="53" font-size="8" fill="white" font-weight="bold">τ</text>
  
  <!-- Mechanical output flange (right boundary) -->
  <circle cx="95" cy="50" r="6" fill="#E74C3C" stroke="#000" stroke-width="2"/>
  <line x1="90" y1="50" x2="100" y2="50" stroke="#000" stroke-width="1.5"/>
  <line x1="95" y1="45" x2="95" y2="55" stroke="#000" stroke-width="1.5"/>
  
  <!-- M label -->
  <text x="45" y="55" font-size="14" fill="white" font-weight="bold">M</text>
</svg>
