<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Battery body -->
  <rect x="25" y="35" width="50" height="40" fill="#27AE60" stroke="#000" stroke-width="2" rx="3"/>
  
  <!-- Battery terminal -->
  <rect x="45" y="30" width="10" height="5" fill="#333" stroke="#000" stroke-width="1.5"/>
  
  <!-- Charge level indicator (animated) -->
  <rect x="30" y="65" width="40" height="5" fill="#1E8449" opacity="0.8">
    <animate attributeName="width" values="40;20;40" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Plus/Minus symbols -->
  <text x="33" y="55" font-size="16" fill="white" font-weight="bold">+</text>
  <text x="63" y="55" font-size="16" fill="white" font-weight="bold">−</text>
  
  <!-- SOC percentage (animated) -->
  <text x="43" y="50" font-size="10" fill="white" font-weight="bold">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    70%
  </text>
  
  <!-- Energy flow particles (animated) -->
  <circle cx="50" cy="25" r="2" fill="#FFD700">
    <animate attributeName="cy" values="25;15;10" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Power connection indicator (bottom boundary) -->
  <circle cx="50" cy="95" r="5" fill="#E74C3C" stroke="#000" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="50" y2="100" stroke="#000" stroke-width="1.5"/>
  <text x="46" y="88" font-size="8" fill="#333" font-weight="bold">P</text>
</svg>
