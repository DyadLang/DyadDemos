<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gear-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78909C"/>
      <stop offset="100%" stop-color="#455A64"/>
    </linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <!-- Outer gear -->
  <g fill="url(#gear-metal)" stroke="#37474F" stroke-width="1.5">
    <circle cx="64" cy="64" r="40"/>
    <!-- Gear teeth -->
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(0 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(30 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(60 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(90 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(120 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(150 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(180 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(210 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(240 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(270 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(300 64 64)"/>
    <rect x="58" y="16" width="12" height="14" rx="2" transform="rotate(330 64 64)"/>
  </g>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="28" fill="#546E7A" stroke="#37474F" stroke-width="1.5"/>
  <!-- Lightning bolt (electric) -->
  <path d="M72 34 L56 62 L68 62 L54 94 L78 58 L64 58 Z" fill="url(#electric)" stroke="#0D47A1" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Electric glow highlight -->
  <path d="M72 34 L56 62 L68 62 L54 94 L78 58 L64 58 Z" fill="#64B5F6" opacity="0.25"/>
</svg>
