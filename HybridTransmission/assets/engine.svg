<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Engine block -->
  <rect x="20" y="30" width="60" height="40" fill="#333" stroke="#000" stroke-width="2" rx="5"/>
  
  <!-- Cylinders -->
  <rect x="30" y="20" width="12" height="15" fill="#666" stroke="#000" stroke-width="1.5"/>
  <rect x="58" y="20" width="12" height="15" fill="#666" stroke="#000" stroke-width="1.5"/>
  
  <!-- Pistons (animated) -->
  <rect x="32" y="15" width="8" height="8" fill="#999">
    <animate attributeName="y" values="15;12;15" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="15" width="8" height="8" fill="#999">
    <animate attributeName="y" values="12;15;12" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Throttle input port (left boundary) -->
  <circle cx="5" cy="50" r="5" fill="#4A90E2" stroke="#000" stroke-width="1.5"/>
  <text x="3" y="53" font-size="8" fill="white" font-weight="bold">T</text>
  
  <!-- Mechanical output flange (right boundary) -->
  <circle cx="95" cy="50" r="6" fill="#E74C3C" stroke="#000" stroke-width="2"/>
  <line x1="90" y1="50" x2="100" y2="50" stroke="#000" stroke-width="1.5"/>
  <line x1="95" y1="45" x2="95" y2="55" stroke="#000" stroke-width="1.5"/>
  
  <!-- Exhaust particles (animated) -->
  <circle cx="70" cy="25" r="2" fill="#888" opacity="0.5">
    <animate attributeName="cy" values="25;10;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.3;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="28" r="2" fill="#888" opacity="0.5">
    <animate attributeName="cy" values="28;13;8" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.3;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
