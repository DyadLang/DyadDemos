<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5d6d7e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main engine block -->
  <rect x="20" y="40" width="60" height="40" fill="url(#engineGrad)" stroke="#1a252f" stroke-width="1.5" rx="4"/>
  
  <!-- Cooling fins -->
  <line x1="25" y1="45" x2="25" y2="75" stroke="#7f8c8d" stroke-width="1.5" opacity="0.4"/>
  <line x1="30" y1="45" x2="30" y2="75" stroke="#7f8c8d" stroke-width="1.5" opacity="0.4"/>
  <line x1="70" y1="45" x2="70" y2="75" stroke="#7f8c8d" stroke-width="1.5" opacity="0.4"/>
  <line x1="75" y1="45" x2="75" y2="75" stroke="#7f8c8d" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Cylinders with animation -->
  <g id="cylinder1">
    <rect x="32" y="28" width="10" height="16" fill="url(#cylinderGrad)" stroke="#1a252f" stroke-width="1" rx="2"/>
    <rect x="34" y="24" width="6" height="6" fill="#e74c3c" rx="1">
      <animate attributeName="y" values="24;21;24" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="6;9;6" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <g id="cylinder2">
    <rect x="45" y="28" width="10" height="16" fill="url(#cylinderGrad)" stroke="#1a252f" stroke-width="1" rx="2"/>
    <rect x="47" y="24" width="6" height="6" fill="#e74c3c" rx="1">
      <animate attributeName="y" values="21;24;21" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="9;6;9" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <g id="cylinder3">
    <rect x="58" y="28" width="10" height="16" fill="url(#cylinderGrad)" stroke="#1a252f" stroke-width="1" rx="2"/>
    <rect x="60" y="24" width="6" height="6" fill="#e74c3c" rx="1">
      <animate attributeName="y" values="24;21;24" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="6;9;6" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Crankshaft -->
  <circle cx="50" cy="60" r="7" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 50 60" to="360 50 60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="60" r="2.5" fill="#34495e"/>
  
  <!-- Exhaust flow (animated) -->
  <g opacity="0.6">
    <circle cx="72" cy="32" r="2" fill="#95a5a6">
      <animate attributeName="cy" values="32;18;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="35" r="2" fill="#95a5a6">
      <animate attributeName="cy" values="35;21;13" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;4" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Power indicator -->
  <circle cx="50" cy="85" r="3" fill="#f39c12" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
