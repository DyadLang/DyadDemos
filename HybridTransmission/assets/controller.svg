<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Controller housing -->
  <rect x="20" y="20" width="60" height="60" fill="#34495E" stroke="#000" stroke-width="2" rx="5"/>
  
  <!-- Display screen -->
  <rect x="27" y="27" width="46" height="25" fill="#1ABC9C" stroke="#000" stroke-width="1.5" rx="2"/>
  
  <!-- Digital waveform (animated) -->
  <polyline points="30,39 35,39 38,35 41,43 44,35 47,39 50,39" 
            fill="none" stroke="#fff" stroke-width="2">
    <animate attributeName="points" 
             values="30,39 35,39 38,35 41,43 44,35 47,39 50,39;
                     30,39 35,35 38,43 41,35 44,43 47,35 50,39;
                     30,39 35,39 38,35 41,43 44,35 47,39 50,39"
             dur="2s" repeatCount="indefinite"/>
  </polyline>
  
  <!-- SOC indicator -->
  <rect x="30" y="45" width="15" height="4" fill="#27AE60" rx="1">
    <animate attributeName="width" values="15;8;15" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="48" y="48" font-size="6" fill="#fff">SOC</text>
  
  <!-- Status LEDs (blinking) -->
  <circle cx="30" cy="60" r="2" fill="#E74C3C">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="60" r="2" fill="#F39C12">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="60" r="2" fill="#27AE60">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Input ports (left boundary) -->
  <circle cx="5" cy="35" r="4" fill="#4A90E2" stroke="#000" stroke-width="1.5"/>
  <text x="1" y="38" font-size="7" fill="white" font-weight="bold">P</text>
  
  <circle cx="5" cy="55" r="4" fill="#4A90E2" stroke="#000" stroke-width="1.5"/>
  <text x="1" y="58" font-size="7" fill="white" font-weight="bold">S</text>
  
  <!-- Output ports (right boundary) -->
  <circle cx="95" cy="30" r="4" fill="#E74C3C" stroke="#000" stroke-width="1.5"/>
  <text x="91" y="33" font-size="7" fill="white" font-weight="bold">E</text>
  
  <circle cx="95" cy="50" r="4" fill="#E74C3C" stroke="#000" stroke-width="1.5"/>
  <text x="89" y="53" font-size="6" fill="white" font-weight="bold">M1</text>
  
  <circle cx="95" cy="70" r="4" fill="#E74C3C" stroke="#000" stroke-width="1.5"/>
  <text x="89" y="73" font-size="6" fill="white" font-weight="bold">M2</text>
  
  <!-- Processing indicator -->
  <text x="32" y="72" font-size="8" fill="#95A5A6" font-family="monospace">
    k_soc mg2
  </text>
</svg>
