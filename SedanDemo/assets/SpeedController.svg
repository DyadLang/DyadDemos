  <g stroke="#333" stroke-width="12">
    <line x1="500" y1="180" x2="500" y2="240"/>
    <line x1="273" y1="273" x2="315" y2="315"/>
    <line x1="727" y1="273" x2="685" y2="315"/>
    <line x1="180" y1="500" x2="240" y2="500"/>
    <line x1="820" y1="500" x2="760" y2="500"/>
