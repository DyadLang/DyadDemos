# Euro NCAP CCRs (car-to-car rear, stationary target) test conditions, measurement
# definitions and scoring, read from the authoritative protocol below. Scripts and
# tests read these values; no other file repeats them.
#
# Protocol text is cited by section and page and paraphrased; the PDF is not
# redistributed here. `page` is the printed page, `pdf_page` the PDF page.

[source]
title = "Euro NCAP Crash Avoidance - Frontal Collisions - Protocol"
version = "1.2"
date = "July 2026"
implementation = "January 2026"
url = "https://cdn.euroncap.com/cars/assets/Euro_NCAP_Protocol_Crash_Avoidance_Frontal_Collisions_v1_2_220d87e28a.pdf"
sha256 = "b99c59d10707fca6b9fb537ca439887c049552ea7babdc234d9f22286c814236"
pdf_page_offset = 2  # pdf_page = page + 2

[matrix]
# §3.1.1.1 table, page 29 / pdf_page 31.
source = "section 3.1.1.1, page 29 / pdf_page 31"
vut_speed_kmh = [10, 20, 30, 40, 50, 60, 70, 80]
target_speed_kmh = 0
aeb_cells_kmh = [10, 20, 30, 40, 50]
fcw_cells_kmh = [60, 70, 80]
# The manufacturer may verify the FCW cells with AEB; a matching AEB colour awards
# the FCW points (same table, pdf_page 31).
impact_location_standard_pct = [0, 25, 50, 75, 100]
impact_location_extended_pct = [-25, 125]

[impact_location]
# §1.2.5, page 13 / pdf_page 15: the target reference point is aligned with a
# percentage of the VUT width; 0 % projects the outer near-side edge, 100 % the
# outer far-side edge. §1.4.1.4, page 21 / pdf_page 23: for rear scenarios the
# target reference point is the rearmost point of the target, at its centre.
# §1.1.1, page 8 / pdf_page 10: near and far side as drawn for a left-hand-drive
# car (near side = right), mirrored for right-hand drive.
source = "sections 1.2.5, 1.4.1.4, 1.1.1"
near_side = "right"  # left-hand-drive VUT

[conduct]
ttc_start_s = 4.0                     # T0 = TTC 4 s; §1.5.1, page 22 / pdf_page 24
accelerator_release_drop_kmh = 5.0    # §4.3.2, page 65 / pdf_page 67
# Boundary conditions hold from T0 until AEB/FCW starts; §4.3.2, page 64 / pdf_page 66.
# The VUT speed tolerance is printed "+ 1.0 km/h"; see DEC-8 for the reading.
vut_speed_tolerance_kmh = 1.0
vut_lateral_deviation_m = 0.05
target_lateral_deviation_m = 0.10
surface_peak_braking_coefficient_min = 0.9  # §2.1, page 24 / pdf_page 26
sample_rate_min_hz = 100.0                  # §1.5, page 22 / pdf_page 24
# Acceleration and yaw rate: 12-pole phaseless Butterworth, 10 Hz cut-off;
# §1.5.3, page 23 / pdf_page 25.
accel_filter_cutoff_hz = 10.0
accel_filter_order = 12

[measurement]
# Definitions, page 4 / pdf_page 6; §1.3.1, page 18 / pdf_page 20.
# Vimpact: VUT speed when its front profile meets the target's virtual box.
# The front profile joins seven points spread evenly over the VUT width minus
# 50 mm on each side. Vrel_impact = Vimpact - target speed (= Vimpact here).
front_profile_points = 7
front_profile_inset_m = 0.050
# TAEB: first sample where the filtered acceleration is below -3 m/s^2, traced
# back to where it first crossed -1 m/s^2.
taeb_detect_mps2 = -3.0
taeb_onset_mps2 = -1.0

[criterion]
id = "REQ-AEB-1"
case = "vut_speed_kmh <= 20 at every standard impact location"
vimpact_max_kmh = 0.0
quote = "full avoidance shall be achieved for test speeds up to and including 20 km/h"
source = "section 5.1, page 66 / pdf_page 68"
basis = "Entry condition for any CCRs AEB points; read as Vimpact = 0 (no contact) in every standard-range cell at 10 and 20 km/h."

[colour_bands]
# Vrel_impact colour bands, Figure 5-1, page 67 / pdf_page 69 (read from the
# rendered figure). Each band is an upper bound in km/h, exclusive of the
# previous band: green is Vimpact = 0, red is anything above the last bound.
# Same bands in text for 60 km/h: §4.2.4 table, page 62 / pdf_page 64.
source = "Figure 5-1, page 67 / pdf_page 69"
order = ["green", "yellow", "orange", "brown"]
10 = { green = 0.0 }
20 = { green = 0.0 }
30 = { green = 0.0, brown = 10.0 }
40 = { green = 0.0, orange = 10.0, brown = 20.0 }
50 = { green = 0.0, yellow = 10.0, orange = 20.0, brown = 30.0 }
60 = { green = 0.0, yellow = 10.0, orange = 20.0, brown = 30.0 }
70 = { green = 0.0, yellow = 10.0, orange = 20.0, brown = 30.0 }
80 = { green = 0.0, yellow = 10.0, orange = 20.0, brown = 30.0 }

[scoring]
# §5.3.1, page 73 / pdf_page 75; points from the §3.1.1 table, page 28 / pdf_page 30.
colour_subscore = { green = 1.00, yellow = 0.75, orange = 0.50, brown = 0.25, red = 0.0 }
standard_range_points = 1.2   # sum of sub-scores x 1.2 / number of standard cells
extended_range_points = 0.15  # §5.3.2: fraction of non-red cells, stepped 50/75/100 %
robustness_points = 0.15      # out of scope (DEC-3)
extended_steps = [[0.50, 0.50], [0.75, 0.75], [1.00, 1.00]]  # [fraction >=, credited]
