<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f1fb"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="0.5" stop-color="#c8c8c8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="984" height="984" rx="40" fill="url(#bg)" stroke="#1f4e79" stroke-width="12"/>
  <!-- shaft to the spline port -->
  <rect x="600" y="470" width="400" height="60" fill="url(#shaft)" stroke="#444" stroke-width="4"/>
  <!-- multipole magnet ring -->
  <g stroke="#333" stroke-width="6">
    <path d="M620 500L620 290A210 210 0 0 1 830 500Z" fill="#d9534f"/>
    <path d="M620 500L830 500A210 210 0 0 1 620 710Z" fill="#3a7bd5"/>
    <path d="M620 500L620 710A210 210 0 0 1 410 500Z" fill="#d9534f"/>
    <path d="M620 500L410 500A210 210 0 0 1 620 290Z" fill="#3a7bd5"/>
  </g>
  <circle cx="620" cy="500" r="55" fill="#9a9a9a" stroke="#333" stroke-width="6"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="700" y="430">N</text>
    <text x="700" y="625">S</text>
    <text x="540" y="625">N</text>
    <text x="540" y="430">S</text>
  </g>
  <!-- Hall IC with leads -->
  <rect x="230" y="420" width="110" height="160" rx="10" fill="#222"/>
  <path d="M230 455H130M230 500H130M230 545H130" stroke="#555" stroke-width="10"/>
  <path d="M352 440Q385 500 352 560" fill="none" stroke="#f0ad4e" stroke-width="8"/>
  <path d="M374 425Q420 500 374 575" fill="none" stroke="#f0ad4e" stroke-width="8"/>
  <path d="M0 500H130" stroke="#00007f" stroke-width="8"/>
  <text x="285" y="380" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold" fill="#222" text-anchor="middle">H</text>
  <text x="500" y="900" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="bold" fill="#1f4e79" text-anchor="middle">HALL</text>
  <text x="80" y="440" font-family="Arial, Helvetica, sans-serif" font-size="60" fill="#00007f" text-anchor="middle">rpm</text>
</svg>
