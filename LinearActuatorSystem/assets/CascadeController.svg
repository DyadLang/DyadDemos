    <text x="100" y="465" font-size="56" font-style="italic" fill="#00007f">n*</text>
    <text x="560" y="465" font-size="56" font-style="italic" fill="#00007f">i*</text>
    <text x="300" y="900" font-size="56" font-style="italic" fill="#00007f">n</text>
    <text x="700" y="900" font-size="56" font-style="italic" fill="#00007f">i</text>
    <text x="205" y="450" font-size="48" fill="#000">+</text>
    <text x="605" y="450" font-size="48" fill="#000">+</text>
    <text x="290" y="600" font-size="56" fill="#000">&#8722;</text>
