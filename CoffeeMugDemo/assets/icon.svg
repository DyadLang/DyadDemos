<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>
  <!-- Saucer -->
  <ellipse cx="58" cy="112" rx="44" ry="10" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="1.5"/>
  <ellipse cx="58" cy="110" rx="40" ry="8" fill="#E0E0E0"/>
  <!-- Mug body -->
  <path d="M28 44 L28 96 Q28 108 58 108 Q88 108 88 96 L88 44 Z" fill="url(#mug)" stroke="#BCAAA4" stroke-width="2"/>
  <!-- Coffee surface -->
  <ellipse cx="58" cy="52" rx="28" ry="8" fill="url(#coffee)"/>
  <!-- Coffee crema -->
  <ellipse cx="58" cy="51" rx="24" ry="6" fill="#5D4037" opacity="0.6"/>
  <!-- Mug rim -->
  <ellipse cx="58" cy="44" rx="30" ry="9" fill="none" stroke="#BCAAA4" stroke-width="2.5"/>
  <ellipse cx="58" cy="44" rx="30" ry="9" fill="url(#mug)" opacity="0.3"/>
  <!-- Handle -->
  <path d="M88 56 Q108 56 108 76 Q108 96 88 96" fill="none" stroke="#BCAAA4" stroke-width="5" stroke-linecap="round"/>
  <path d="M88 60 Q104 60 104 76 Q104 92 88 92" fill="none" stroke="url(#mug)" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M44 38 Q40 28 44 20 Q48 12 44 4" stroke="#8D6E63"/>
    <path d="M58 34 Q54 24 58 16 Q62 8 58 0" stroke="#8D6E63"/>
    <path d="M72 38 Q68 28 72 20 Q76 12 72 4" stroke="#8D6E63"/>
  </g>
  <!-- Spoon handle peeking out -->
  <g transform="rotate(-20 58 52)">
    <path d="M70 48 L100 18" stroke="#9E9E9E" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="102" cy="15" rx="5" ry="8" transform="rotate(-20 102 15)" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="1.5"/>
  </g>
</svg>
