name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

env:
  JULIA_PKG_SERVER: internal.juliahub.com
  JULIAUP_SERVER: "https://juliahub.com/juliabin"
  # Single source of truth for the Julia toolchain CI runs the demos on: the
  # Dyad 3.5 distribution, matching every demo's `[dyad].kernel` and the
  # `julia +...` pin in its `.vscode/settings.json`. It has to be the
  # distribution, not stock `release`: it bundles the Component libraries as
  # stdlibs, and the demos' environments resolve against those.
  #
  # (CI used to run `release` because the 3.3 builds set `USE_GPL_LIBS = false`,
  # which broke Hypatia -> DyadControlSystems -> MakieWebinar at precompile
  # time. The 3.5 builds set it to `true`.)
  JULIA_CHANNEL: dyad-3.5.0-rc1
  # dyad-lang's `getEnv()` honours `JULIA_EXECUTABLE` ahead of each package's
  # `.vscode/settings.json`, so this makes codegen use one toolchain across all
  # demos regardless of the per-demo editor pins. Keep it in step with
  # `JULIA_CHANNEL`.
  JULIA_EXECUTABLE: julia +dyad-3.5.0-rc1
  # The rc1 sys.so requests an executable stack, which glibc >= 2.41 refuses
  # ("cannot enable executable stack") unless this tunable allows it. Older
  # glibc ignores the unknown tunable.
  GLIBC_TUNABLES: glibc.rtld.execstack=2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # NB: the `env` context is not available in `jobs.<id>.name`, so the channel
    # is spelled out here; keep it in step with `JULIA_CHANNEL` above.
    name: Julia dyad-3.5.0-rc1 - self-hosted - x64 - ${{ github.event_name }}

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: julia-actions/install-juliaup@v3
        with:
          channel: ${{ env.JULIA_CHANNEL }}

      - name: "Set up private JuliaHub registries"
        uses: "JuliaComputing/set-up-private-juliahub-registries@93a57d352d8435399461ffe68df41d193e4619b3" # v1.3.0
        with:
          encoded-juliahub-token: "${{ secrets.JULIAHUB_TOKEN_ENCODED }}"
          enable-JuliaHubRegistry: "true"
          # ssh-key: "${{ secrets.JULIASIM_REGISTRY_SSH_KEY }}"

      - name: "Instantiate CI environment"
        run: julia --project=.ci -e 'using Pkg; Pkg.instantiate()'

      - name: "Run CI script"
        run: julia --project=.ci .ci/run.jl
