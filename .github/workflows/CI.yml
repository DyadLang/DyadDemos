name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

env:
  JULIA_PKG_SERVER: internal.juliahub.com
  JULIAUP_SERVER: "https://juliahub.com/juliabin"
  JULIA_CHANNEL: dyad-3.5.1
  JULIA_EXECUTABLE: julia +dyad-3.5.1
  JULIA_PKG_USE_CLI_GIT: "true"
  JULIA_NUM_THREADS: "2"
  JULIA_NUM_PRECOMPILE_TASKS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # NB: the `env` context is not available in `jobs.<id>.name`, so the channel
    # is spelled out here; keep it in step with `JULIA_CHANNEL` above.
    name: Dyad 3.5.1 - self-hosted - x64 - ${{ github.event_name }}

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: julia-actions/install-juliaup@8d13b44e0eb1620c4e2d2d0a4ceee7d98100b955 # v3
        with:
          channel: ${{ env.JULIA_CHANNEL }}

      - name: "Set up private JuliaHub registries"
        uses: "JuliaComputing/set-up-private-juliahub-registries@93a57d352d8435399461ffe68df41d193e4619b3" # v1.3.0
        with:
          encoded-juliahub-token: "${{ secrets.JULIAHUB_TOKEN_ENCODED }}"
          enable-JuliaHubRegistry: "true"
          # ssh-key: "${{ secrets.JULIASIM_REGISTRY_SSH_KEY }}"

      - name: "Install and verify Dyad 3.5.1 CLI"
        shell: bash
        run: bash .ci/setup-dyad-cli.sh

      - name: "Instantiate CI environment"
        run: julia --project=.ci -e 'using Pkg; Pkg.instantiate()'

      - name: "Run CI script"
        run: julia --project=.ci .ci/run.jl
