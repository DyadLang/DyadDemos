<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Outer block -->
  <rect x="80" y="80" width="840" height="840" rx="30" ry="30"
        fill="#faf5ff" stroke="#6b21a8" stroke-width="8"/>

  <!-- Eye symbol (observer "sees" the state) -->
  <!-- Outer eye shape -->
  <path d="M 200,460 Q 500,220 800,460 Q 500,700 200,460 Z"
        fill="none" stroke="#6b21a8" stroke-width="7"/>
  <!-- Iris -->
  <circle cx="500" cy="460" r="110" fill="none" stroke="#7c3aed" stroke-width="6"/>
  <!-- Pupil -->
  <circle cx="500" cy="460" r="55" fill="#6b21a8"/>
  <!-- Pupil highlight -->
  <circle cx="520" cy="440" r="18" fill="#e9d5ff"/>

  <!-- Estimation waves radiating from eye (observer sensing) -->
  <path d="M 200,300 Q 160,260 200,220" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.7"/>
  <path d="M 160,320 Q 110,270 160,200" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.5"/>
  <path d="M 800,300 Q 840,260 800,220" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.7"/>
  <path d="M 840,320 Q 890,270 840,200" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.5"/>

  <!-- x-hat symbol below eye -->
  <!-- Hat (caret) -->
  <path d="M 440,760 L 500,710 L 560,760" fill="none" stroke="#6b21a8" stroke-width="7"/>
  <!-- x body (two crossing lines) -->
  <line x1="460" y1="770" x2="540" y2="850" stroke="#6b21a8" stroke-width="7"/>
  <line x1="540" y1="770" x2="460" y2="850" stroke="#6b21a8" stroke-width="7"/>

  <!-- Correction arrow (feedback loop, left side) -->
  <path d="M 180,750 L 180,600" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <polygon points="172,605 180,580 188,605" fill="#7c3aed"/>

  <!-- Input arrow (measurement, right side) -->
  <path d="M 820,600 L 820,750" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <polygon points="812,745 820,770 828,745" fill="#7c3aed"/>

  <!-- L gain badge (top-left) -->
  <rect x="140" y="120" width="100" height="70" rx="10" ry="10"
        fill="#ede9fe" stroke="#6b21a8" stroke-width="4"/>
  <!-- L shape -->
  <line x1="175" y1="135" x2="175" y2="175" stroke="#6b21a8" stroke-width="6"/>
  <line x1="175" y1="175" x2="215" y2="175" stroke="#6b21a8" stroke-width="6"/>
</svg>
