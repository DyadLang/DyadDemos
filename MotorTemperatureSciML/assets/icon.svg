<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="mt-motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#EF6C00"/>
    </linearGradient>
    <linearGradient id="mt-merc" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <radialGradient id="mt-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4DD0E1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4DD0E1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background panel -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#mt-bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#mt-glow)"/>

  <!-- Motor body with cooling fins -->
  <rect x="18" y="42" width="58" height="44" rx="8" fill="url(#mt-motor)" stroke="#3E2723" stroke-width="1.5"/>
  <g stroke="#3E2723" stroke-width="1.5" opacity="0.55">
    <path d="M28 42v44M38 42v44M48 42v44M58 42v44M68 42v44"/>
  </g>
  <!-- Shaft -->
  <rect x="76" y="60" width="18" height="8" rx="3" fill="#78909C"/>

  <!-- Neural net nodes over the motor -->
  <g fill="#4DD0E1" stroke="#00363A" stroke-width="1">
    <circle cx="30" cy="30" r="4"/>
    <circle cx="47" cy="22" r="4"/>
    <circle cx="64" cy="30" r="4"/>
  </g>
  <g stroke="#4DD0E1" stroke-width="1.4" opacity="0.7" fill="none">
    <path d="M30 30 47 22M47 22 64 30M30 30 64 30"/>
    <path d="M30 34 30 42M47 26 47 42M64 34 64 42"/>
  </g>

  <!-- Thermometer -->
  <g>
    <rect x="97" y="22" width="12" height="64" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
    <circle cx="103" cy="96" r="12" fill="url(#mt-merc)" stroke="#455A64" stroke-width="1.5"/>
    <rect x="100" y="44" width="6" height="46" rx="3" fill="url(#mt-merc)"/>
    <g stroke="#90A4AE" stroke-width="1.2">
      <path d="M97 34h5M97 46h5M97 58h5M97 70h5"/>
    </g>
  </g>
</svg>
