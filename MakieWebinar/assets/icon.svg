<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chart-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Background panel -->
  <rect x="8" y="8" width="112" height="112" rx="12" fill="#1A1A2E" stroke="#2A2A4E" stroke-width="1.5"/>
  <!-- Grid lines -->
  <g stroke="#2A2A4E" stroke-width="0.8">
    <line x1="24" y1="30" x2="24" y2="100"/>
    <line x1="24" y1="100" x2="112" y2="100"/>
    <line x1="24" y1="76" x2="112" y2="76" stroke-dasharray="2 3" opacity="0.4"/>
    <line x1="24" y1="52" x2="112" y2="52" stroke-dasharray="2 3" opacity="0.4"/>
  </g>
  <!-- Area fill under curve -->
  <path d="M24 88 Q36 82 44 70 Q52 56 60 62 Q68 68 76 48 Q84 30 92 36 Q100 42 108 34 L108 100 L24 100 Z" fill="url(#chart-fill)"/>
  <!-- Main chart line -->
  <path d="M24 88 Q36 82 44 70 Q52 56 60 62 Q68 68 76 48 Q84 30 92 36 Q100 42 108 34" fill="none" stroke="url(#chart-line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points -->
  <circle cx="44" cy="70" r="3.5" fill="#E040FB" stroke="#1A1A2E" stroke-width="1.5"/>
  <circle cx="76" cy="48" r="3.5" fill="#E040FB" stroke="#1A1A2E" stroke-width="1.5"/>
  <circle cx="108" cy="34" r="3.5" fill="#FF4081" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Interactive slider track -->
  <rect x="24" y="110" rx="2" width="88" height="4" fill="#2A2A4E"/>
  <!-- Slider thumb -->
  <circle cx="68" cy="112" r="5" fill="#7C4DFF" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Second line (parameter sweep) -->
  <path d="M24 94 Q40 90 52 80 Q64 70 76 66 Q88 62 108 52" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" stroke-linecap="round"/>
  <!-- Cursor crosshair -->
  <g opacity="0.7">
    <line x1="76" y1="40" x2="76" y2="100" stroke="#E040FB" stroke-width="0.8" stroke-dasharray="3 2"/>
    <line x1="24" y1="48" x2="84" y2="48" stroke="#E040FB" stroke-width="0.8" stroke-dasharray="3 2"/>
  </g>
</svg>
