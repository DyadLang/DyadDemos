<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="roof-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
  </defs>
  <!-- House body -->
  <rect x="22" y="56" width="84" height="60" fill="url(#wall)" stroke="#4E342E" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="14,58 64,16 114,58" fill="url(#roof-grad)" stroke="#4E342E" stroke-width="2" stroke-linejoin="round"/>
  <!-- Chimney -->
  <rect x="82" y="22" width="14" height="28" fill="#795548" stroke="#4E342E" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="52" y="82" width="24" height="34" rx="2" fill="#4E342E" stroke="#3E2723" stroke-width="1.5"/>
  <circle cx="72" cy="100" r="2" fill="#FFD54F"/>
  <!-- Windows -->
  <g fill="#FFF9C4" stroke="#4E342E" stroke-width="1.5" opacity="0.9">
    <rect x="30" y="66" width="16" height="14" rx="1"/>
    <rect x="82" y="66" width="16" height="14" rx="1"/>
  </g>
  <!-- Window crosses -->
  <g stroke="#4E342E" stroke-width="1">
    <line x1="38" y1="66" x2="38" y2="80"/>
    <line x1="30" y1="73" x2="46" y2="73"/>
    <line x1="90" y1="66" x2="90" y2="80"/>
    <line x1="82" y1="73" x2="98" y2="73"/>
  </g>
  <!-- Window warm glow -->
  <rect x="31" y="67" width="14" height="12" fill="url(#warm)" opacity="0.4" rx="1"/>
  <rect x="83" y="67" width="14" height="12" fill="url(#warm)" opacity="0.4" rx="1"/>
  <!-- Heat waves from chimney — bolder -->
  <g fill="none" stroke="#FF6F00" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M86 20 Q81 10 86 2 Q91 -6 86 -12"/>
    <path d="M93 18 Q88 8 93 0 Q98 -8 93 -14"/>
  </g>
  <!-- Heat loss arrows — much bigger and bolder -->
  <g opacity="0.75">
    <!-- Left arrow -->
    <line x1="20" y1="80" x2="4" y2="80" stroke="#42A5F5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="4,80 10,75 10,85" fill="#42A5F5"/>
    <!-- Right arrow -->
    <line x1="108" y1="80" x2="124" y2="80" stroke="#42A5F5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="124,80 118,75 118,85" fill="#42A5F5"/>
    <!-- Roof arrow left -->
    <line x1="38" y1="34" x2="26" y2="20" stroke="#42A5F5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="26,20 33,22 28,27" fill="#42A5F5"/>
    <!-- Roof arrow right -->
    <line x1="90" y1="34" x2="102" y2="20" stroke="#42A5F5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="102,20 95,22 100,27" fill="#42A5F5"/>
    <!-- Floor arrow -->
    <line x1="64" y1="116" x2="64" y2="126" stroke="#42A5F5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="64,126 59,120 69,120" fill="#42A5F5"/>
  </g>
</svg>
