<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ps-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A38"/>
      <stop offset="100%" stop-color="#0C141C"/>
    </linearGradient>
    <linearGradient id="ps-mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <linearGradient id="ps-seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#EF6C00"/>
    </linearGradient>
    <radialGradient id="ps-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4DD0E1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4DD0E1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background panel -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#ps-bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#ps-glow)"/>

  <!-- Seat + rider mass (the comfort metric is measured here) -->
  <rect x="36" y="20" width="56" height="14" rx="4" fill="url(#ps-seat)" stroke="#BF360C" stroke-width="1.5"/>

  <!-- Seat suspension: spring and damper in parallel -->
  <polyline points="48,34 40,40 56,45 40,50 56,55 44,59"
            fill="none" stroke="#4DD0E1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#B0BEC5" stroke-width="4" stroke-linecap="round">
    <line x1="78" y1="34" x2="78" y2="42"/>
    <line x1="78" y1="51" x2="78" y2="59"/>
  </g>
  <rect x="69" y="41" width="18" height="12" rx="2.5" fill="#455A64" stroke="#ECEFF1" stroke-width="2"/>

  <!-- Sprung mass: car body -->
  <rect x="30" y="59" width="68" height="16" rx="4" fill="url(#ps-mass)" stroke="#37474F" stroke-width="1.5"/>

  <!-- Primary suspension: spring and damper in parallel -->
  <polyline points="48,75 40,81 56,86 40,91 56,96 44,100"
            fill="none" stroke="#4DD0E1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#B0BEC5" stroke-width="4" stroke-linecap="round">
    <line x1="78" y1="75" x2="78" y2="83"/>
    <line x1="78" y1="92" x2="78" y2="100"/>
  </g>
  <rect x="69" y="82" width="18" height="12" rx="2.5" fill="#455A64" stroke="#ECEFF1" stroke-width="2"/>

  <!-- Unsprung mass: wheel -->
  <circle cx="64" cy="106" r="10" fill="#263238" stroke="#B0BEC5" stroke-width="2.5"/>
  <circle cx="64" cy="106" r="3.5" fill="#B0BEC5"/>

  <!-- ISO 8608 Class C road profile -->
  <path d="M 12 118 C 20 112, 26 122, 34 116 C 42 110, 48 121, 56 117 C 64 113, 70 120, 78 115
           C 86 110, 92 120, 100 114 C 108 108, 112 118, 118 114"
        fill="none" stroke="#FFB74D" stroke-width="4" stroke-linecap="round"/>
</svg>
